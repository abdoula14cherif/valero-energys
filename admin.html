<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Sinipec Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0d13;--card:#12161f;--card2:#1b2130;--primary:#f59e0b;--primary2:#ea580c;--accent:#fbbf24;--green:#16a34a;--red:#dc2626;--purple:#9c27b0;--text:#e8e6e2;--muted:#8b8f99;--border:#262c3a;}
body{min-height:100vh;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(circle at 85% 0%, rgba(245,158,11,.12) 0%, transparent 45%),var(--bg);}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 28px;width:100%;max-width:380px;}
.login-mark{width:48px;height:48px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);}
.login-mark svg{width:22px;height:22px;}
.login-logo{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:800;letter-spacing:2px;text-align:center;margin-bottom:4px;color:var(--text);text-transform:uppercase;}
.login-badge{display:block;width:fit-content;margin:0 auto 24px;background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.35);color:#fca5a5;font-size:11px;font-weight:700;padding:3px 12px;border-radius:20px;}
.lf{margin-bottom:13px;}
.lf label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;}
.lf input{width:100%;padding:12px 14px;font-size:14px;font-family:inherit;border:1.5px solid var(--border);border-radius:11px;outline:none;background:var(--bg);color:var(--text);}
.lf input:focus{border-color:var(--primary);}
.btn-login{width:100%;padding:14px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:15px;font-weight:700;border:none;border-radius:12px;cursor:pointer;font-family:inherit;}
.login-err{background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.4);color:#fca5a5;padding:10px;border-radius:10px;font-size:13px;margin-bottom:13px;display:none;}
.login-err.show{display:block;}
.admin-wrap{display:flex;min-height:100vh;}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:250;}
.sidebar-backdrop.show{display:block;}
.sidebar{width:220px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:300;transition:transform .25s;}
.sidebar.collapsed{transform:translateX(-220px);}
.sb-header{padding:16px;border-bottom:1px solid var(--border);}
.sb-logo{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:800;letter-spacing:1px;color:var(--text);text-transform:uppercase;}
.sb-role{font-size:11px;color:var(--muted);margin-top:3px;}
.sb-menu{flex:1;overflow-y:auto;padding:8px 0;}
.sb-item{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;border:none;background:none;width:100%;text-align:left;font-family:inherit;transition:all .2s;border-left:3px solid transparent;}
.sb-item:hover{background:rgba(255,255,255,.04);color:var(--text);}
.sb-item.active{color:var(--primary);background:rgba(245,158,11,.08);border-left-color:var(--primary);}
.sb-item .si{font-size:18px;flex-shrink:0;}
.sb-sep{height:1px;background:var(--border);margin:8px 16px;}
.sb-group{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:8px 16px 4px;}
.badge-n{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px;margin-left:auto;}
.badge-g{background:var(--accent);color:#1a1a1a;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px;margin-left:auto;}
.main-content{margin-left:220px;flex:1;transition:margin .25s;min-width:0;}
.main-content.full{margin-left:0;}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;}
.toggle-sb{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px;}
.tb-title{font-size:15px;font-weight:700;flex:1;}
.tb-actions{display:flex;align-items:center;gap:10px;}
.tb-email{font-size:12px;color:var(--muted);display:none;}
.btn-quit-tb{background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.3);color:#fca5a5;font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.page-content{padding:16px;}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
.stat-card{background:var(--card);border-radius:14px;padding:16px;border-top:3px solid var(--primary);position:relative;overflow:hidden;}
.stat-card.gold{border-top-color:var(--accent);}
.stat-card.green{border-top-color:var(--green);}
.stat-card.red{border-top-color:var(--red);}
.stat-card.purple{border-top-color:var(--purple);}
.stat-card.orange{border-top-color:var(--primary2);}
.stat-card.blue{border-top-color:#1565c0;}
.sc-icon{font-size:26px;margin-bottom:8px;opacity:.8;}
.sc-val{font-size:22px;font-weight:800;font-family:'Space Grotesk',sans-serif;color:var(--text);margin-bottom:3px;}
.sc-lbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;}
.sc-sub{font-size:11px;color:var(--muted);margin-top:4px;}
.sec-card{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden;}
.sec-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.sec-title{font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;}
.sec-body{padding:14px 16px;}
.inner-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.inner-tab{padding:7px 14px;background:var(--card2);border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);font-family:inherit;}
.inner-tab.active{border-color:var(--primary);color:var(--primary);background:rgba(245,158,11,.08);}
.search-row{display:flex;gap:8px;margin-bottom:12px;}
.search-input{flex:1;padding:9px 13px;font-size:13px;font-family:inherit;border:1.5px solid var(--border);border-radius:10px;outline:none;background:var(--bg);color:var(--text);}
.search-input:focus{border-color:var(--primary);}
.btn-search{padding:9px 16px;background:var(--primary);border:none;border-radius:10px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.tx-item{border-bottom:1px solid var(--border);padding:12px 0;}
.tx-item:last-child{border-bottom:none;}
.tx-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.tx-user{font-size:13px;font-weight:700;color:var(--text);}
.tx-amount{font-size:15px;font-weight:800;font-family:'Space Grotesk',sans-serif;}
.tx-amount.plus{color:var(--green);}
.tx-amount.minus{color:var(--red);}
.tx-details{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.6;}
.tx-ref{font-size:11px;color:var(--primary);word-break:break-all;}
.tx-actions{display:flex;gap:6px;margin-top:8px;}
.btn-v{padding:7px 14px;background:rgba(22,163,74,.15);border:1px solid rgba(22,163,74,.4);color:#86efac;font-size:11px;font-weight:700;border-radius:8px;cursor:pointer;font-family:inherit;}
.btn-r{padding:7px 14px;background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.4);color:#fca5a5;font-size:11px;font-weight:700;border-radius:8px;cursor:pointer;font-family:inherit;}
.statut-b{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;}
.s-attente{background:rgba(245,158,11,.15);color:var(--primary);}
.s-valide{background:rgba(22,163,74,.15);color:var(--green);}
.s-rejete{background:rgba(220,38,38,.15);color:var(--red);}
.user-item{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);padding:12px 0;}
.user-item:last-child{border-bottom:none;}
.u-avatar{width:40px;height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;font-family:'Space Grotesk',sans-serif;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);}
.u-info{flex:1;min-width:0;}
.u-name{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.u-email{font-size:11px;color:var(--muted);margin-top:1px;}
.u-meta{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap;}
.u-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;}
.ub-solde{background:rgba(245,158,11,.15);color:var(--primary);}
.ub-role{background:rgba(156,39,176,.15);color:#ce93d8;}
.ub-bloque{background:rgba(220,38,38,.15);color:#fca5a5;}
.ub-promo{background:rgba(245,158,11,.15);color:var(--accent);}
.ub-mgr{background:rgba(22,163,74,.15);color:var(--green);}
.u-actions{display:flex;gap:5px;flex-shrink:0;}
.btn-u{padding:6px 10px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;border:none;background:rgba(255,255,255,.08);color:var(--text);}
.btn-u:hover{background:rgba(255,255,255,.14);}
.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;font-size:13px;font-family:inherit;border:1.5px solid var(--border);border-radius:10px;outline:none;background:var(--bg);color:var(--text);}
.form-group input:focus,.form-group select:focus{border-color:var(--primary);}
.form-row{display:flex;gap:8px;flex-wrap:wrap;}
.form-row .form-group{flex:1;min-width:120px;}
.btn-primary{padding:11px 20px;background:linear-gradient(135deg,var(--primary),var(--primary2));border:none;border-radius:10px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-success{padding:11px 20px;background:rgba(22,163,74,.18);border:1px solid rgba(22,163,74,.4);border-radius:10px;color:#86efac;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-danger{padding:11px 20px;background:rgba(220,38,38,.18);border:1px solid rgba(220,38,38,.4);border-radius:10px;color:#fca5a5;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-warning{padding:11px 20px;background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.35);border-radius:10px;color:var(--primary);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-full{width:100%;margin-top:8px;}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:7px;}
.pagination{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 0 0;flex-wrap:wrap;}
.pg-btn{padding:7px 12px;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.pg-btn:disabled{opacity:.4;cursor:not-allowed;}
.pg-btn.active{border-color:var(--primary);color:var(--primary);background:rgba(245,158,11,.08);}
.pg-info{font-size:12px;color:var(--muted);}
.alert{padding:10px 13px;border-radius:10px;font-size:13px;margin-bottom:12px;display:none;}
.alert.show{display:block;}
.a-err{background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.4);color:#fca5a5;}
.a-ok{background:rgba(22,163,74,.15);border:1px solid rgba(22,163,74,.4);color:#86efac;}
.a-info{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--primary);}
.toast{position:fixed;top:16px;right:16px;left:16px;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:700;z-index:9999;display:none;max-width:320px;margin-left:auto;}
.toast.show{display:block;}
.toast.ok{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;}
.toast.err{background:var(--red);color:#fff;}
.toast.warn{background:var(--accent);color:#1a1a1a;}
.code-auto-box{background:linear-gradient(135deg,rgba(245,158,11,.1),rgba(234,88,12,.05));border:2px solid rgba(245,158,11,.3);border-radius:16px;padding:20px;text-align:center;}
.code-display{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:800;color:var(--accent);letter-spacing:4px;margin:12px 0;}
.code-timer{font-size:22px;font-weight:800;color:var(--red);font-family:'Space Grotesk',sans-serif;}
.code-expired{color:var(--muted);font-size:14px;}
.vip0-status{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.v0-box{background:var(--card2);border-radius:12px;padding:14px;text-align:center;}
.v0-val{font-size:20px;font-weight:800;font-family:'Space Grotesk',sans-serif;}
.v0-lbl{font-size:10px;color:var(--muted);font-weight:600;margin-top:3px;text-transform:uppercase;}
.action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px;}
.ud-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px;}
.ud-modal.show{display:flex;}
.ud-box{background:var(--card);border:1px solid var(--border);border-radius:20px;width:100%;max-width:480px;margin:auto;}
.ud-header{padding:18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.ud-body{padding:18px;}
.ud-section{margin-bottom:16px;}
.ud-sec-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.ud-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;gap:10px;}
.ud-row:last-child{border-bottom:none;}
.ud-label{color:var(--muted);white-space:nowrap;}
.ud-val{font-weight:700;color:var(--text);text-align:right;word-break:break-word;}
.ud-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.btn-close-ud{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;}
.empty{text-align:center;padding:32px;color:var(--muted);}
.empty-icon{font-size:36px;margin-bottom:10px;}
.loading-skeleton{background:linear-gradient(90deg,var(--card2) 25%,var(--border) 50%,var(--card2) 75%);background-size:200%;animation:sk 1.5s infinite;border-radius:8px;height:60px;margin-bottom:8px;}
@keyframes sk{0%{background-position:200%}100%{background-position:-200%}}

/* ── RESPONSIVE MOBILE : sidebar en tiroir plein écran plutôt qu'en colonne fixe ── */
@media(max-width:840px){
  .sidebar{width:78vw;max-width:280px;box-shadow:0 0 50px rgba(0,0,0,.5);}
  .sidebar.collapsed{transform:translateX(-100%);}
  .main-content{margin-left:0!important;}
  .stats-grid{grid-template-columns:1fr 1fr;}
  .ud-actions{grid-template-columns:1fr;}
  .form-row{flex-direction:column;}
  .tb-email{display:none;}
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>

<div class="ud-modal" id="udModal">
  <div class="ud-box">
    <div class="ud-header">
      <div style="font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:800;" id="udTitle">Détails utilisateur</div>
      <button class="btn-close-ud" onclick="closeUD()">&#x2715;</button>
    </div>
    <div class="ud-body" id="udBody">Chargement...</div>
  </div>
</div>

<!-- LOGIN -->
<div id="loginPage" class="login-page">
  <div class="login-box">
    <div class="login-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="#fff"/></svg>
    </div>
    <div class="login-logo">Sinipec</div>
    <div class="login-badge">ADMIN PANEL</div>
    <div id="loginErr" class="login-err"></div>

    <button class="btn-login" onclick="doLogin()">Accéder</button>
  </div>
</div>

<!-- ADMIN -->
<div id="adminWrap" class="admin-wrap" style="display:none;">
  <div class="sidebar collapsed" id="sidebar">
    <div class="sb-header">
      <div class="sb-logo">Sinipec</div>
      <div class="sb-role" id="sbRole">Admin</div>
    </div>
    <div class="sb-menu">
      <div class="sb-group">Vue d'ensemble</div>
      <button class="sb-item active" onclick="goTo('dashboard',this)"><span class="si">&#x1F4CA;</span>Dashboard<span class="badge-n" id="bage-att">0</span></button>
      <div class="sb-sep"></div>
      <div class="sb-group">Transactions</div>
      <button class="sb-item" onclick="goTo('depots',this)"><span class="si">&#x1F4B3;</span>Dépôts<span class="badge-n" id="badge-dep">0</span></button>
      <button class="sb-item" onclick="goTo('retraits',this)"><span class="si">&#x1F4B8;</span>Retraits<span class="badge-n" id="badge-ret">0</span></button>
      <div class="sb-sep"></div>
      <div class="sb-group">Membres</div>
      <button class="sb-item" onclick="goTo('users',this)"><span class="si">&#x1F465;</span>Utilisateurs</button>
      <button class="sb-item" onclick="goTo('investissements',this)"><span class="si">&#x1F4C8;</span>Investissements</button>
      <button class="sb-item" onclick="goTo('roles',this)"><span class="si">&#x1F451;</span>Rôles</button>
      <div class="sb-sep"></div>
      <div class="sb-group">Produits</div>
      <button class="sb-item" onclick="goTo('vip0',this)"><span class="si">&#x2B50;</span>VIP0 Gratuit</button>
      <button class="sb-item" onclick="goTo('codes',this)"><span class="si">&#x1F381;</span>Codes Cadeaux</button>
      <div class="sb-sep"></div>
      <button class="sb-item" onclick="doLogout()" style="color:#fca5a5;"><span class="si">&#x1F6AA;</span>Déconnexion</button>
    </div>
  </div>

  <div class="main-content full" id="mainContent">
    <div class="topbar">
      <button class="toggle-sb" onclick="toggleSidebar()">&#x2630;</button>
      <div class="tb-title" id="pageTitle">Dashboard</div>
      <div class="tb-actions">
        <span class="tb-email" id="adminEmailDisplay"></span>
        <button class="btn-quit-tb" onclick="doLogout()">&#x21A9; Quitter</button>
      </div>
    </div>
    <div class="page-content" id="pageContent">
      <div class="loading-skeleton"></div>
      <div class="loading-skeleton"></div>
    </div>
  </div>
</div>

function toast(msg,type="ok"){const el=document.getElementById("toast");el.textContent=msg;el.className="toast "+type+" show";setTimeout(()=>el.classList.remove("show"),3500);}

function toggleSidebar(){
  const sb=document.getElementById("sidebar");
  const bk=document.getElementById("sidebarBackdrop");

async function G(url){const r=await fetch(SB+"/rest/v1/"+url,{headers:H()});if(!r.ok)return[];return r.json();}
async function P(url,data){return fetch(SB+"/rest/v1/"+url,{method:"POST",headers:{...H(),"Prefer":"return=representation"},body:JSON.stringify(data)}).then(r=>r.json());}
async function PATCH(url,data){return fetch(SB+"/rest/v1/"+url,{method:"PATCH",headers:H(),body:JSON.stringify(data)});}
async function DEL(url){return fetch(SB+"/rest/v1/"+url,{method:"DELETE",headers:H()});}

// ── AUTH
async function doLogin(){
  const email=document.getElementById("adminEmail").value.trim();
  const pass=document.getElementById("adminPass").value;
  const errEl=document.getElementById("loginErr");
  if(!email||!pass){errEl.textContent="Remplissez tous les champs";errEl.className="login-err show";return;}
  const r=await fetch(SB+"/auth/v1/token?grant_type=password",{
    method:"POST",headers:{"Content-Type":"application/json","apikey":AK},
    body:JSON.stringify({email,password:pass})
  });
  const d=await r.json();
  if(!d.access_token){errEl.textContent=d.error_description||"Identifiants incorrects";errEl.className="login-err show";return;}

  const rp=await fetch(SB+"/rest/v1/profiles?id=eq."+d.user.id+"&select=role,email",{
    headers:{"Content-Type":"application/json","apikey":AK,"Authorization":"Bearer "+d.access_token}
  });
  const dp=await rp.json();
  const role=dp[0]?.role||"user";

  if(role!=="admin"&&role!=="manager"&&!ADMIN_EMAILS.includes(email)){
    errEl.textContent="Accès refusé — rôle insuffisant";errEl.className="login-err show";return;
  }

  AT=d.access_token;
  adminRole=ADMIN_EMAILS.includes(email)?"admin":role;

  localStorage.setItem("admin_tok",AT);
  localStorage.setItem("admin_role",adminRole);
  localStorage.setItem("admin_email",email);

  document.getElementById("loginPage").style.display="none";
  document.getElementById("adminWrap").style.display="flex";
  document.getElementById("sbRole").textContent=adminRole==="admin"?"Super Admin":adminRole==="manager"?"Manager":"Promoteur";
  document.getElementById("adminEmailDisplay").textContent=email;
  loadBadges();
  goTo("dashboard",document.querySelector(".sb-item"));
}

function doLogout(){
  localStorage.removeItem("admin_tok");
  localStorage.removeItem("admin_role");
  localStorage.removeItem("admin_email");
  AT="";
  document.getElementById("adminWrap").style.display="none";
  document.getElementById("loginPage").style.display="flex";
}

if(AT){
  adminRole=localStorage.getItem("admin_role")||"admin";
  const savedEmail=localStorage.getItem("admin_email")||"";
  document.getElementById("loginPage").style.display="none";
  document.getElementById("adminWrap").style.display="flex";
  document.getElementById("sbRole").textContent=adminRole==="admin"?"Super Admin":adminRole==="manager"?"Manager":"Promoteur";
  document.getElementById("adminEmailDisplay").textContent=savedEmail;
  loadBadges();
  goTo("dashboard",document.querySelector(".sb-item"));
}

function txHTML(tx,type){
  const p=tx.profiles||{};
  const date=new Date(tx.created_at).toLocaleDateString("fr-FR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
  const actions=tx.statut==="en_attente"?`
    <div class="tx-actions">
      <button class="btn-v" onclick="validerTx('${tx.id}','${tx.user_id}',${tx.montant},'${type}')">Valider</button>
      <button class="btn-r" onclick="rejeterTx('${tx.id}','${tx.user_id}',${tx.montant},'${type}')">Rejeter</button>
    </div>`:"";
  return `<div class="tx-item" id="tx-${tx.id}">
    <div class="tx-top">
      <div>
        <div class="tx-user">${p.full_name||p.email||"—"}</div>
        <div class="tx-details">${tx.reseau||"—"} · ${tx.numero_mobile||"—"}<br>${date}<br>${tx.note||"—"}</div>
        ${tx.reference?`<div class="tx-ref">${tx.reference}</div>`:""}
      </div>
      <div style="text-align:right;">
        <div class="tx-amount ${type==="depot"?"plus":"minus"}">${parseFloat(tx.montant).toLocaleString()} F</div>
        <span class="statut-b ${tx.statut==="en_attente"?"s-attente":tx.statut==="valide"?"s-valide":"s-rejete"}">${tx.statut==="en_attente"?"Attente":tx.statut==="valide"?"Validé":"Rejeté"}</span>
      </div>
    </div>
    ${actions}
  </div>`;
}

async function validerTx(id,userId,montant,type){
  if(!confirm("Valider "+parseInt(montant).toLocaleString()+" F ?"))return;
  await PATCH("transactions?id=eq."+id,{statut:"valide"});
  if(type==="depot"){
    const p=await G("profiles?id=eq."+userId+"&select=solde");
    await PATCH("profiles?id=eq."+userId,{solde:parseFloat(p[0]?.solde||0)+parseFloat(montant)});
  }
  toast("Validé ! Solde crédité.");
  document.getElementById("tx-"+id)?.remove();
  loadBadges();
}

async function rejeterTx(id,userId,montant,type){
  if(!confirm("Rejeter cette transaction ?"))return;
  await PATCH("transactions?id=eq."+id,{statut:"rejete"});
  if(type==="retrait"){
    const p=await G("profiles?id=eq."+userId+"&select=solde");
    await PATCH("profiles?id=eq."+userId,{solde:parseFloat(p[0]?.solde||0)+parseFloat(montant)});
  }
  toast("Rejeté.","err");
  document.getElementById("tx-"+id)?.remove();
  loadBadges();
}

async function crediterUser(id,nom){
  const m=prompt("Montant à CRÉDITER pour "+nom+" (FCFA) :");
  if(!m||isNaN(m)||parseInt(m)<=0)return;
  const raison=prompt("Raison :")||"Crédit admin";
  const p=await G("profiles?id=eq."+id+"&select=solde");
  await PATCH("profiles?id=eq."+id,{solde:parseFloat(p[0]?.solde||0)+parseInt(m)});
  await P("transactions",{user_id:id,type:"bonus",montant:parseInt(m),montant_net:parseInt(m),statut:"valide",note:"Crédit admin: "+raison});
  toast(parseInt(m).toLocaleString()+" F crédités à "+nom);
  closeUD();renderUsers();
}

async function debiterUser(id,nom){
  const m=prompt("Montant à DÉBITER pour "+nom+" (FCFA) :");
  if(!m||isNaN(m)||parseInt(m)<=0)return;
  const p=await G("profiles?id=eq."+id+"&select=solde");
  const nouveau=Math.max(0,parseFloat(p[0]?.solde||0)-parseInt(m));
  await PATCH("profiles?id=eq."+id,{solde:nouveau});
  toast(parseInt(m).toLocaleString()+" F débités de "+nom);
  closeUD();renderUsers();
}

async function changerMDP(id){
  const mdp=prompt("Nouveau mot de passe :");
  if(!mdp||mdp.length<6){alert("Minimum 6 caractères");return;}
  const r=await fetch(SB+"/auth/v1/admin/users/"+id,{method:"PUT",headers:H(),body:JSON.stringify({password:mdp})});
  if(r.ok){toast("Mot de passe modifié !");}
  else{toast("Erreur — utilisez le dashboard Supabase (clé service_role requise)","err");}
}

// ── ATTRIBUTION DE PLAN DIRECTE (corrigé : plus de dépendance à une table "plans" inexistante)
async function attribuerPlan(userId,nom){
  const key=document.getElementById("planAttribSelect").value;
  const plan=PLANS_ADMIN[key];
  if(!plan)return;
  if(!confirm("Activer le plan "+key+" ("+plan.invest.toLocaleString()+" FCFA, "+plan.revenu.toLocaleString()+" FCFA/j) pour "+nom+" ?"))return;

  await P("investissements",{
    user_id:userId,plan_nom:key,montant:plan.invest,
    revenu_jour:plan.revenu,jours_restants:100,statut:"actif"
  });
  await P("transactions",{
    user_id:userId,type:"investissement",montant:plan.invest,montant_net:plan.invest,
    statut:"valide",note:"Plan "+key+" attribué par l'administrateur"
  });
  toast("Plan "+key+" activé pour "+nom+" !");
  closeUD();
}

async function toggleRetrait(id,bloque){
  await PATCH("profiles?id=eq."+id,{retrait_bloque:!bloque});

async function toggleBan(id,bloque){

// ── INVESTISSEMENTS (corrigé : jours_total fixe à 100, colonne "montant" au lieu de "montant_investi")
const JOURS_TOTAL_DEFAUT=100;

async function renderInvestissements(pg=1){
  setContent(`<div class="loading-skeleton"></div><div class="loading-skeleton"></div>`);
  const offset=(pg-1)*PAGE_SIZE;
  const [invs,count]=await Promise.all([
    G(`investissements?order=created_at.desc&limit=${PAGE_SIZE}&offset=${offset}&select=*,profiles(full_name,email)`),
    G("investissements?select=id")
  ]);
  const pages=Math.ceil(count.length/PAGE_SIZE);
  setContent(`
    <div class="sec-card">
      <div class="sec-header"><div class="sec-title">Investissements — <span style="color:var(--muted);font-weight:400;font-size:13px;">${count.length} total</span></div></div>
      <div class="sec-body">
        ${invs.map(inv=>{
          const p=inv.profiles||{};
          const pct=Math.round(((JOURS_TOTAL_DEFAUT-inv.jours_restants)/JOURS_TOTAL_DEFAUT)*100);
          return `<div class="tx-item">
            <div class="tx-top">
              <div>
                <div class="tx-user">Plan ${inv.plan_nom}</div>
                <div class="tx-details">${p.full_name||p.email||"—"}<br>${parseFloat(inv.montant||0).toLocaleString()} F · +${parseFloat(inv.revenu_jour||0).toLocaleString()} F/j<br>${inv.jours_restants}/${JOURS_TOTAL_DEFAUT} jours restants</div>
              </div>
              <div>
                <span class="statut-b ${inv.statut==="actif"?"s-valide":"s-rejete"}">${inv.statut==="actif"?"Actif":"Terminé"}</span>
                <div style="background:var(--border);border-radius:20px;height:5px;margin-top:8px;width:80px;"><div style="background:var(--primary);border-radius:20px;height:100%;width:${pct}%;"></div></div>
              </div>
            </div>
            <div class="tx-actions">
              <button class="btn-r" onclick="terminerInvest('${inv.id}')">Terminer</button>
            </div>
          </div>`;
        }).join("")}
        ${pagHTML(pages,pg,(p)=>`renderInvestissements(${p})`)}
      </div>
    </div>
  `);
}

async function terminerInvest(id){
  if(!confirm("Terminer cet investissement ?"))return;
  await PATCH("investissements?id=eq."+id,{statut:"termine",jours_restants:0});
  toast("Investissement terminé");renderInvestissements();
}

  setContent(`

      <div class="sec-header"><div class="sec-title">Gestion des Rôles</div></div>
      <div class="sec-body">
        <div class="alert a-info show" style="margin-bottom:14px;">
          <strong>Admin</strong> : accès total au panneau admin (comme toi).
          <strong>Manager</strong> : peut voir et valider dépôts/retraits.
          <strong>Promoteur</strong> : accès aux statistiques et comptes membres.
        </div>
        <div class="form-group"><label>Email de l'utilisateur</label><input type="email" id="roleEmail" placeholder="utilisateur@email.com"/></div>
        <div class="form-group">
          <label>Rôle à attribuer</label>
          <select id="roleSelect">
            <option value="admin">Admin</option>
            <option value="manager">Manager</option>
            <option value="promoteur">Promoteur</option>
            <option value="user">Utilisateur (retirer le rôle)</option>
          </select>
        </div>
        <button class="btn-primary" onclick="attribuerRole()">Attribuer le rôle</button>
      </div>
    </div>
    <div class="sec-card" style="margin-top:12px;">
      <div class="sec-header"><div class="sec-title">Membres avec rôle spécial</div></div>
      <div class="sec-body">
        ${users.length===0?`<div class="empty"><div class="empty-icon">&#x1F451;</div>Aucun membre avec rôle spécial</div>`:""}
        ${users.map(u=>{
          const label=u.role==="admin"?"Admin":u.role==="manager"?"Manager":"Promoteur";
          const cls=u.role==="admin"?"ub-role":u.role==="manager"?"ub-mgr":"ub-promo";
          return `<div class="user-item">
          <div class="u-avatar">${(u.full_name||u.email||"U")[0].toUpperCase()}</div>
          <div class="u-info">
            <div class="u-name">${u.full_name||"—"}</div>
            <div class="u-email">${u.email}</div>
            <div class="u-meta"><span class="u-badge ${cls}">${label}</span></div>
          </div>
          <button class="btn-danger btn-sm" onclick="retirerRole('${u.id}','${u.full_name||u.email}')">Retirer</button>

async function attribuerRole(){
  const email=document.getElementById("roleEmail").value.trim();
  const role=document.getElementById("roleSelect").value;
  if(!email)return toast("Entrez un email","warn");
  if(role==="admin"&&!confirm("Donner l'accès ADMIN complet à "+email+" ? Cette personne pourra tout faire dans ce panneau (crédits, bans, gestion des rôles...)."))return;
  const users=await G("profiles?email=eq."+email+"&select=id,full_name");
  if(!users.length)return toast("Utilisateur introuvable","err");
  await PATCH("profiles?id=eq."+users[0].id,{role});
  toast("Rôle "+role+" attribué à "+(users[0].full_name||email));
  renderRoles();
}

async function retirerRole(id,nom){
  if(!confirm("Retirer le rôle de "+nom+" ?"))return;
  await PATCH("profiles?id=eq."+id,{role:"user"});
  toast("Rôle retiré de "+nom);renderRoles();
}

    <div class="sec-card">
      <div class="sec-header"><div class="sec-title">VIP0 — Offre Gratuite</div></div>
      <div class="sec-body">
        ${offre?`
          <div class="vip0-status">
            <div class="v0-box"><div class="v0-val" style="color:${offre.actif?"var(--green)":"var(--red)"};">${offre.actif?"ACTIF":"INACTIF"}</div><div class="v0-lbl">Statut</div></div>

          </div>
          <div class="action-grid">
            <button class="btn-success" onclick="activerVIP0('${offre.id}')">Activer</button>
            <button class="btn-danger" onclick="desactiverVIP0('${offre.id}')">Désactiver</button>
            <button class="btn-warning" onclick="reinitVIP0('${offre.id}')">Réinitialiser places</button>
            <button class="btn-primary" onclick="renderVIP0()">Rafraîchir</button>
          </div>`:`<div class="empty"><div class="empty-icon">&#x2B50;</div>Aucune offre configurée</div>`}
      </div>
    </div>
    <div class="sec-card" style="margin-top:12px;">
      <div class="sec-header"><div class="sec-title">Réclamations (${users.length})</div></div>
      <div class="sec-body">
        ${users.length===0?`<div class="empty"><div class="empty-icon">&#x1F4ED;</div>Personne n'a encore réclamé</div>`:""}
        ${users.map(u=>`<div class="user-item">
          <div class="u-avatar">${(u.profiles?.full_name||u.profiles?.email||"U")[0].toUpperCase()}</div>
          <div class="u-info"><div class="u-name">${u.profiles?.full_name||"—"}</div><div class="u-email">${u.profiles?.email||"—"}</div></div>
          <div style="font-size:11px;color:var(--muted);">${new Date(u.created_at).toLocaleDateString("fr-FR",{day:"2-digit",month:"short"})}</div>

async function activerVIP0(id){await PATCH("offre_gratuite?id=eq."+id,{actif:true,date_activation:new Date().toISOString()});toast("VIP0 activé !");renderVIP0();}
async function desactiverVIP0(id){await PATCH("offre_gratuite?id=eq."+id,{actif:false});toast("VIP0 désactivé","warn");renderVIP0();}
async function reinitVIP0(id){
  if(!confirm("Réinitialiser les places ?"))return;
  const off=await G("offre_gratuite?id=eq."+id+"&select=places_total");
  await PATCH("offre_gratuite?id=eq."+id,{places_restantes:off[0]?.places_total||100,actif:false});
  await DEL("offre_gratuite_users?offre_id=eq."+id);
  toast("Réinitialisé");renderVIP0();
}

// ── CODES CADEAUX
async function renderCodes(){
  const codes=await G("codes_cadeaux?order=created_at.desc&limit=50&select=*");
  setContent(`
    <div class="sec-card">
      <div class="sec-header"><div class="sec-title">Code Auto (15h00)</div></div>
      <div class="sec-body">
        <div class="code-auto-box">
          <div style="font-size:13px;color:rgba(245,158,11,.8);margin-bottom:8px;">Code valide 3 minutes · Généré à 15h00</div>
          <div id="autoCodeDisplay"><div class="code-expired">En attente de génération</div></div>
          <div style="margin-top:12px;">
            <button class="btn-warning" onclick="genererCodeAuto()">Générer code maintenant</button>
          </div>
        </div>
      </div>
    </div>
    <div class="sec-card" style="margin-top:12px;">
      <div class="sec-header"><div class="sec-title">Créer un code</div></div>
      <div class="sec-body">
        <div id="codeFormAlert" class="alert"></div>
        <div class="form-row">
          <div class="form-group"><label>Code</label><input type="text" id="newCode" placeholder="SINIPEC500" style="text-transform:uppercase;" oninput="this.value=this.value.toUpperCase()"/></div>
          <button class="btn-warning" style="align-self:flex-end;padding:10px 14px;border-radius:10px;" onclick="genCode()">Aléatoire</button>
        </div>
        <div class="form-group"><label>Description</label><input type="text" id="newDesc" placeholder="Promo..."/></div>
        <div class="form-row">
          <div class="form-group"><label>Montant (F)</label><input type="number" id="newMontant" placeholder="500"/></div>
          <div class="form-group"><label>Max utilisations</label><input type="number" id="newUtil" placeholder="100"/></div>
        </div>
        <div class="form-group"><label>Expiration (optionnel)</label><input type="date" id="newExpire"/></div>
        <button class="btn-primary btn-full" onclick="creerCode()">Créer le code</button>
      </div>
    </div>
    <div class="sec-card" style="margin-top:12px;">
      <div class="sec-header"><div class="sec-title">Codes existants (${codes.length})</div></div>
      <div class="sec-body">
        ${codes.map(c=>{
          const pct=c.utilisations_max>0?Math.round((c.utilisations_actuelles/c.utilisations_max)*100):0;
          const exp=c.expire_le?new Date(c.expire_le).toLocaleDateString("fr-FR"):c.expire_at?new Date(c.expire_at).toLocaleString("fr-FR"):"Illimité";
          return `<div class="tx-item">
            <div class="tx-top">
              <div>
                <div style="font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:800;color:var(--accent);letter-spacing:2px;">${c.code}</div>
                <div class="tx-details">+${parseFloat(c.montant).toLocaleString()} F · ${c.description||"—"}<br>${c.utilisations_actuelles}/${c.utilisations_max} utilisations · ${exp}</div>
                <div style="background:var(--border);border-radius:20px;height:4px;margin-top:6px;"><div style="background:var(--primary);border-radius:20px;height:100%;width:${pct}%;"></div></div>
              </div>
              <span class="statut-b ${c.actif?"s-valide":"s-rejete"}">${c.actif?"Actif":"Inactif"}</span>
            </div>
            <div class="tx-actions">
              <button class="btn-v" onclick="navigator.clipboard.writeText('${c.code}').then(()=>toast('Copié !'))">Copier</button>
              <button class="${c.actif?"btn-r":"btn-v"}" onclick="toggleCode('${c.id}',${c.actif})">${c.actif?"Désactiver":"Activer"}</button>
            </div>
          </div>`;
        }).join("")}
      </div>
    </div>
  `);
}

async function genererCodeAuto(){
  const code="SI"+Math.random().toString(36).substring(2,8).toUpperCase();
  const expireAt=new Date(Date.now()+3*60*1000).toISOString();
  await PATCH("codes_cadeaux?auto_genere=eq.true",{actif:false});
  await P("codes_cadeaux",{code,description:"Code automatique 15h",montant:100,utilisations_max:1000,utilisations_actuelles:0,actif:true,auto_genere:true,expire_at:expireAt,expire_le:null});
  const el=document.getElementById("autoCodeDisplay");
  if(!el)return;
  el.innerHTML=`<div class="code-display">${code}</div><div class="code-timer" id="codeCountdown">3:00</div>`;
  let seconds=180;
  if(autoCodeInterval)clearInterval(autoCodeInterval);
  autoCodeInterval=setInterval(async()=>{
    seconds--;
    const el2=document.getElementById("codeCountdown");
    if(el2)el2.textContent=Math.floor(seconds/60)+":"+(seconds%60).toString().padStart(2,"0");
    if(seconds<=0){
      clearInterval(autoCodeInterval);
      await PATCH("codes_cadeaux?code=eq."+code,{actif:false});
      const el3=document.getElementById("autoCodeDisplay");
      if(el3)el3.innerHTML=`<div class="code-expired">Code expiré — Prochain code à 15h00</div>`;
    }
  },1000);
  toast("Code auto généré : "+code+" (valide 3 min)");
}

function genCode(){
  const c="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  let code="SI";for(let i=0;i<6;i++)code+=c[Math.floor(Math.random()*c.length)];
  document.getElementById("newCode").value=code;
}

async function creerCode(){
  const code=document.getElementById("newCode").value.trim().toUpperCase();
  const desc=document.getElementById("newDesc").value.trim();
  const montant=parseInt(document.getElementById("newMontant").value);
  const util=parseInt(document.getElementById("newUtil").value);
  const expire=document.getElementById("newExpire").value||null;
  const al=document.getElementById("codeFormAlert");
  if(!code||!montant||!util){al.textContent="Code, montant et utilisations requis";al.className="alert a-err show";return;}
  const r=await P("codes_cadeaux",{code,description:desc||"Code cadeau",montant,utilisations_max:util,utilisations_actuelles:0,expire_le:expire,actif:true,auto_genere:false});
  if(Array.isArray(r)&&r.length>0){al.textContent="Code créé : "+code;al.className="alert a-ok show";renderCodes();}
  else{al.textContent="Erreur création";al.className="alert a-err show";}
}

async function toggleCode(id,actif){
  await PATCH("codes_cadeaux?id=eq."+id,{actif:!actif});
  toast(actif?"Code désactivé":"Code activé");renderCodes();
}

// ── PAGINATION
function pagHTML(pages,current,fn){
  if(pages<=1)return"";
  let html=`<div class="pagination">`;
  html+=`<button class="pg-btn" onclick="${fn(Math.max(1,current-1))}" ${current===1?"disabled":""}>Préc</button>`;
  for(let i=Math.max(1,current-2);i<=Math.min(pages,current+2);i++)
    html+=`<button class="pg-btn ${i===current?"active":""}" onclick="${fn(i)}">${i}</button>`;
  html+=`<button class="pg-btn" onclick="${fn(Math.min(pages,current+1))}" ${current===pages?"disabled":""}>Suiv</button>`;
  html+=`<span class="pg-info">${current}/${pages}</span></div>`;
  return html;
}

function setContent(html){document.getElementById("pageContent").innerHTML=html;}

// Auto-check 15h
setInterval(()=>{
  const now=new Date();
  if(now.getHours()===15&&now.getMinutes()===0&&now.getSeconds()<5)genererCodeAuto();
},5000);
</script>
